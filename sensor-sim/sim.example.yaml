# ─────────────────────────────────────────────────────────────
#  혼합 센서 시뮬레이터 설정  (이 파일을 sim.yaml 로 복사해서 수정)
# ─────────────────────────────────────────────────────────────
student_id: "202612345"        # ★ 본인 학번 — 방 이름·데이터 패턴·이상치 시점이 학번마다 다르게 생성됨

broker:
  host: mosquitto              # compose 의 브로커 서비스 이름
  port: 1883
  username: null               # 브로커 인증을 켰다면 입력
  password: null
  tls: false                   # 8883 + TLS 로 연결할 때 true (ca_file 지정)
  ca_file: null
  keepalive: 30                # 초. 연결이 끊기면 약 keepalive×1.5 안에 LWT 발행

topic_prefix: auto             # auto → inu/s<학번해시4자리>. ★ 그대로 둘 것
                               #   (바꾸더라도 '<앞칸>/<뒷칸>' 두 칸만 허용 — 칸 수가 다르면 실행 거부)
rooms: 3                       # 방(공간) 개수 1~20. 기기는 방들에 골고루 배치됨
time_scale: 30                 # 시뮬레이션 시간 배속. 30 → 실제 1초 = 30초 (90분 수업 주기가 3분)
sim_start: "09:00"             # 가상 시계 시작 시각 (월요일 HH:MM). 같은 설정이면 매번 같은 하루가 처음부터 재생됨

# ★ 사용할 센서 종류와 개수 (0 이면 사용 안 함, 종류별 최대 50)
sensors:
  env: 3          # 온도(°C)·습도(%)            5초마다
  co2: 2          # CO2(ppm)                    10초마다
  occupancy: 2    # 재실 인원(명)·정원           10초마다
  door: 1         # 문 열림/닫힘                이벤트 발생 시
  power: 2        # 전력(W)·누적 전력량(Wh)      2초마다
  imu: 1          # 가속도(g)·자이로(deg/s)      hz/batch 설정 참고
  vent: 1         # ★ 환기장치(제어 대상)          30초마다 상태 보고 + 명령(cmd) 수신 → ack 응답

# (선택) 종류별 전송 주기(초) 바꾸기 — 실제 시간 기준
intervals:
  # env: 2
  # power: 1

# (선택) 종류별 발행 QoS 바꾸기 — 기본: door·vent 1, 나머지 0. 상태(status) 토픽은 항상 QoS 1 + retain
qos:
  # co2: 1

imu:
  hz: 50          # 초당 샘플 수
  batch: 10       # 한 메시지에 묶는 샘플 수 → 50/10 = 초당 5 메시지

control:          # 고장 주입 제어 서버 (컨테이너 내부 루프백 전용 — host 는 설정으로 바꿀 수 없다)
  port: 9090
