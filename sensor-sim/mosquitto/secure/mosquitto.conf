# ─────────────────────────────────────────────────────────────
#  인증 · ACL 을 켠 브로커 설정 (기말 프로젝트 제출본 기준)
#  compose 에서 이 폴더의 파일들을 /mosquitto/config 로 마운트하고,
#  entrypoint.sh 로 계정 파일을 만들어 쓴다 (README.md 참고)
#
#  ★ 주의: mosquitto.conf 는 "줄 끝 주석" 을 지원하지 않는다.
#     password_file /path   # 설명   ← 이렇게 쓰면 설명까지 경로로 읽혀 기동이 실패한다.
#     주석은 반드시 줄을 따로 쓴다.
# ─────────────────────────────────────────────────────────────

listener 1883

# 익명 접속 금지
allow_anonymous false

# 계정 파일 — entrypoint.sh 가 시작할 때 생성한다
password_file /mosquitto/data/passwd

# 계정별 토픽 권한
acl_file /mosquitto/config/acl

# 재시작해도 retain 메시지가 남지 않게 (채점 · 실험 결과를 매번 같게 만든다).
# true 로 바꾸고 싶다면 "앱을 늦게 켜도 지난 상태가 보이는" 차이를 설계 문서에 적을 것.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
# 누가 무엇을 구독했는지 로그 (장애 진단용)
log_type subscribe

# (선택) TLS — 서버 인증서를 만들었다면 아래를 켜고 1883 대신 8883 사용
# listener 8883
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
